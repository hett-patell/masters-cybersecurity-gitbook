site_name: Masters in Cybersecurity — Het Patel
site_description: Settlement-first research for a cybersecurity master's abroad — UK, Canada, New Zealand — September 2027 intake.
site_author: Het Patel
site_url: https://hett-patell.github.io/masters-cybersecurity-gitbook/

repo_name: hett-patell/masters-cybersecurity-gitbook
repo_url: https://github.com/hett-patell/masters-cybersecurity-gitbook

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/cover.png
  favicon: assets/cover.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hett-patell
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/hetpatel9
    - icon: fontawesome/solid/globe
      link: https://networkshard.com

copyright: "&copy; 2026 Het Patel"

